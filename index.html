<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Feliz Día de las Flores Amarillas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@300;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent default scroll/zoom on mobile */
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Start Screen Styles */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        .flower-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.8)) drop-shadow(0 0 40px rgba(255, 153, 0, 0.6));
            animation: pulse-glow 2s infinite alternate;
            margin-bottom: 20px;
            user-select: none;
        }

        .start-text {
            color: #ffcc00;
            font-family: 'Caveat', cursive;
            font-size: 32px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
            animation: float-text 3s infinite ease-in-out;
            user-select: none;
        }

        /* Animations */
        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.8)) drop-shadow(0 0 40px rgba(255, 153, 0, 0.6)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 30px rgba(255, 220, 0, 1)) drop-shadow(0 0 60px rgba(255, 180, 0, 0.9)); }
        }

        @keyframes float-text {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Main Title Styles */
        #main-title {
            position: absolute;
            top: 5vh;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Caveat', cursive;
            font-size: 54px;
            color: #ffea00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8), 0 0 20px rgba(255, 153, 0, 0.8), 0 0 40px rgba(255, 100, 0, 0.6), 0 0 80px rgba(255, 50, 0, 0.4);
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to the 3D canvas */
            opacity: 0;
            transition: opacity 2s ease-in-out;
            user-select: none;
            line-height: 1.1;
        }

        #main-title span {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 204, 0, 0.8);
        }

        @media (max-width: 768px) {
            #main-title {
                font-size: 36px;
                top: 3vh;
            }
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="start-screen" onclick="startApp()">
        <div class="flower-icon">🌻</div>
        <div class="start-text">Toca para iniciar</div>
    </div>

    <!-- Static Title -->
    <div id="main-title">
        Feliz Día de las Flores Amarillas<br><span>rosilvi</span> 🌻
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let orbitingElements = [];
        let animationId;
        
        const phrases = [
            "Eres mi rayito de sol 🌻",
            "Mi vida es mejor contigo ✨",
            "Para la flor más hermosa 💛",
            "Siempre quiero verte sonreír 😊",
            "Tu luz ilumina mi universo 🌟",
            "Me haces infinitamente feliz 🥰",
            "Un universo entero para ti 🌌",
            "Contigo todos los días son primavera 🌸",
            "Eres mi lugar favorito 🏡",
            "Gracias por existir ❤️",
            "Magia es estar a tu lado ✨",
            "Te quiero de aquí a las estrellas 🚀",
            "ñete ❤️",
            "ñete ❤️",
            "ñete ❤️"
        ];

        const emojis = ["🌻", "💐", "🌼", "🌻", "🌻"];

        // Initialize Three.js scene
        function initScene() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 45); // Elevated and pulled back

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true; // Slowly rotate the entire scene automatically
            controls.autoRotateSpeed = 0.5;
            controls.maxDistance = 100;
            controls.minDistance = 10;

            createStarryBackground();
            createBlackHole();
            createOrbitingElements();

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // Create a starry background using particles
        function createStarryBackground() {
            // Create multiple groups of stars for varying sizes
            const starGroups = [
                { count: 12000, size: 0.15 }, // Many tiny stars
                { count: 6000, size: 0.35 },  // Medium stars
                { count: 2000, size: 0.8 }    // Larger brighter stars
            ];
            
            const colorPalette = [
                new THREE.Color(0xffffff), // White
                new THREE.Color(0xffe87c), // Sun Yellow
                new THREE.Color(0xffb200), // Orange
                new THREE.Color(0xffd700), // Gold
                new THREE.Color(0xffc0cb), // Pinkish
                new THREE.Color(0xfff8dc), // Cornsilk
                new THREE.Color(0xadd8e6), // Light Sky Blue for contrast
                new THREE.Color(0xff69b4)  // Hot Pink
            ];

            starGroups.forEach(group => {
                const starGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(group.count * 3);
                const colors = new Float32Array(group.count * 3);

                for (let i = 0; i < group.count; i++) {
                    // Generate positions in a massive sphere
                    const r = 50 + Math.random() * 500;
                    const theta = 2 * Math.PI * Math.random();
                    const phi = Math.acos(2 * Math.random() - 1);
                    const x = r * Math.sin(phi) * Math.cos(theta);
                    const y = r * Math.sin(phi) * Math.sin(theta);
                    const z = r * Math.cos(phi);
                    
                    positions[i*3] = x;
                    positions[i*3+1] = y;
                    positions[i*3+2] = z;

                    // Assign random colors from the palette
                    const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    colors[i*3] = color.r;
                    colors[i*3+1] = color.g;
                    colors[i*3+2] = color.b;
                }

                starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const starMaterial = new THREE.PointsMaterial({
                    size: group.size,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.9,
                    sizeAttenuation: true
                });

                const stars = new THREE.Points(starGeometry, starMaterial);
                scene.add(stars);
            });
        }

        function createBlackHole() {
            const centerGroup = new THREE.Group();

            // Central Dark Sphere (Black Hole)
            const sphereGeom = new THREE.SphereGeometry(4, 64, 64);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const blackHole = new THREE.Mesh(sphereGeom, sphereMat);
            centerGroup.add(blackHole);

            // Intense Glowing Aura using Sprite and CanvasTexture
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext('2d');
            
            // Create radial gradient for the glow
            const gradient = context.createRadialGradient(256, 256, 0, 256, 256, 256);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 230, 100, 0.9)');
            gradient.addColorStop(0.3, 'rgba(255, 150, 0, 0.6)');
            gradient.addColorStop(0.6, 'rgba(200, 50, 0, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            context.fillStyle = gradient;
            context.fillRect(0, 0, 512, 512);
            
            const auraTexture = new THREE.CanvasTexture(canvas);
            const auraMat = new THREE.SpriteMaterial({
                map: auraTexture,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 1,
                depthWrite: false
            });
            const aura = new THREE.Sprite(auraMat);
            aura.scale.set(40, 40, 1); // Scale aura to be much larger than the black hole
            centerGroup.add(aura);

            // Accretion Disk (Glowing Rings) - Brighter and more vibrant yellow
            const ringColors = [0xffffff, 0xffff00, 0xffea00, 0xffd700, 0xffff33, 0xffcc00];
            
            for(let i = 0; i < 6; i++) {
                const innerRadius = 4.5 + (i * 1.5);
                const outerRadius = innerRadius + 1.5 + (Math.random() * 1.0);
                
                const ringGeom = new THREE.RingGeometry(innerRadius, outerRadius, 128);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: ringColors[i % ringColors.length],
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.8 - (i * 0.1), // Increased opacity for brighter glowing effect
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                
                const ring = new THREE.Mesh(ringGeom, ringMat);
                // Rotate to lay flat
                ring.rotation.x = Math.PI / 2;
                // Add slight tilt for 3D effect
                ring.rotation.y = (Math.random() - 0.5) * 0.15;
                
                centerGroup.add(ring);
            }

            // Intense Central light source
            const light = new THREE.PointLight(0xffeedd, 3, 300);
            centerGroup.add(light);

            scene.add(centerGroup);
        }

        // Helper to generate text as a texture on a canvas
        function createTextSprite(text, config = {}) {
            const {
                fontSize = 40,
                color = '#ffffff',
                isProminent = false,
                isEmoji = false
            } = config;

            const canvas = document.createElement('canvas');
            canvas.width = 1200; // High resolution width for crisp text
            canvas.height = 300; 
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (isEmoji) {
                ctx.font = `${fontSize * 1.5}px 'Inter', sans-serif`;
                ctx.shadowColor = 'rgba(255, 204, 0, 0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            } else {
                ctx.font = isProminent 
                    ? `bold ${fontSize}px 'Caveat', cursive, sans-serif`
                    : `${fontSize}px 'Caveat', cursive, sans-serif`;
                
                ctx.fillStyle = color;
                ctx.shadowColor = isProminent ? '#ffaa00' : '#ffcc00';
                ctx.shadowBlur = isProminent ? 25 : 15;
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            // Improves texture quality
            texture.minFilter = THREE.LinearFilter; 
            
            const material = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true,
                depthTest: false // Ensures text doesn't clip badly into rings
            });
            
            const sprite = new THREE.Sprite(material);
            
            // Scale sprite based on canvas aspect ratio to avoid stretching
            const scale = isProminent ? 2.5 : (config.scale || 1);
            sprite.scale.set(16 * scale, 4 * scale, 1);
            
            return sprite;
        }

        function createOrbitingElements() {
            const totalElements = 250; // High density
            const textColors = ['#ffffff', '#ffddaa', '#ffcc00', '#ffa500', '#ffb6c1', '#ffd700', '#ff8c00', '#ffeecc'];

            for (let i = 0; i < totalElements; i++) {
                const isEmoji = Math.random() < 0.20; // 20% chance of being a flower emoji
                let sprite;
                let scaleFactor = 1;
                
                if (isEmoji) {
                    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                    // Make some emojis huge like bouquets, others small
                    const isHuge = Math.random() > 0.9;
                    const size = isHuge ? 140 : (Math.random() * 50 + 30);
                    scaleFactor = isHuge ? 2.5 : (0.5 + Math.random());
                    sprite = createTextSprite(emoji, { fontSize: size, isEmoji: true, scale: scaleFactor });
                } else {
                    const phrase = phrases[Math.floor(Math.random() * phrases.length)];
                    const size = Math.random() * 25 + 20; // Varying text sizes
                    const color = textColors[Math.floor(Math.random() * textColors.length)];
                    scaleFactor = 0.6 + Math.random() * 0.8;
                    sprite = createTextSprite(phrase, { fontSize: size, color: color, scale: scaleFactor });
                }

                // Spread widely around the black hole with varying heights
                const radius = 10 + Math.random() * 80; // Spread far out
                const speed = (0.0005 + Math.random() * 0.002) * (Math.random() > 0.5 ? 1 : -1); // Some reverse orbit for chaos
                const height = (Math.random() - 0.5) * 55;
                const initialAngle = Math.random() * Math.PI * 2;
                
                addOrbitalData(sprite, radius, speed, height, initialAngle);
                scene.add(sprite);
                orbitingElements.push(sprite);
            }
        }

        function addOrbitalData(mesh, radius, speed, y, angle = Math.random() * Math.PI * 2) {
            mesh.userData = {
                radius: radius,
                angle: angle,
                speed: speed,
                yOffset: y,
                // Add a vertical oscillation factor
                oscillationSpeed: 0.01 + Math.random() * 0.02,
                oscillationAmplitude: Math.random() * 2
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            // Update orbiting elements
            const time = Date.now() * 0.001;
            
            orbitingElements.forEach(el => {
                const data = el.userData;
                data.angle += data.speed;
                
                // Circular motion around Y axis
                el.position.x = Math.cos(data.angle) * data.radius;
                el.position.z = Math.sin(data.angle) * data.radius;
                
                // Gentle floating up and down
                el.position.y = data.yOffset + Math.sin(time * data.oscillationSpeed) * data.oscillationAmplitude;
            });

            controls.update(); // Required for damping and autoRotate
            renderer.render(scene, camera);
        }

        function startApp() {
            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            
            setTimeout(() => {
                startScreen.style.visibility = 'hidden';
                // Show Main Title
                document.getElementById('main-title').style.opacity = '1';
                
                // Initialize scene after click to ensure smooth transition
                if(!scene) {
                    initScene();
                    animate();
                }
            }, 1500);
        }
        
        // Setup initial background loading without rendering everything to save resources
        // Wait for fonts to load before drawing onto canvas
        document.fonts.ready.then(() => {
             // Fonts are ready, user can start smoothly
        });

    </script>
</body>
</html>
